# Cut a release: bump version files, tag, hand off to Publish.
#
#   gh workflow run release.yml -f bump=patch
#   gh workflow run release.yml -f bump=minor
#   gh workflow run release.yml -f bump=major

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

jobs:
  tag:
    name: ${{ inputs.bump }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            major) next="$((major + 1)).0.0" ;;
            *) echo "::error::unknown bump"; exit 1 ;;
          esac
          # First release may already be 0.1.0 untagged — allow tagging current
          # when no v*.*.* tag exists and bump would skip the declared version.
          if ! git rev-parse -q --verify "refs/tags/v${current}" >/dev/null \
             && [ -z "$(git tag -l 'v*.*.*')" ]; then
            echo "::notice::no release tags yet; tagging current ${current}"
            next="$current"
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} + ${BUMP} -> ${next}"

      - name: the tag must not already exist
        env:
          NEXT: v${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::${NEXT} already exists"
            exit 1
          fi

      - name: bump version files when needed
        if: steps.next.outputs.current != steps.next.outputs.version
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = /s/^version = \".*\"/version = \"${NEXT}\"/" Cargo.toml
          sed -i "0,/^version = /s/^version = \".*\"/version = \"${NEXT}\"/" pyproject.toml
          grep -n '^version = ' Cargo.toml pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml pyproject.toml
          git commit -m "chore: release v${NEXT}"
          git push origin HEAD:${{ github.ref_name }}

      # GITHUB_TOKEN pushes do not trigger push-event workflows, so a version-bump
      # commit would otherwise be tagged and published with no CI on that SHA
      # (v0.1.1). Owner rule 2026-11-08: never tag while CI is red on the tip.
      - name: CI must be green on the commit we will tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "${{ github.ref_name }}"
          tip=$(git rev-parse "origin/${{ github.ref_name }}")
          echo "release tip $tip"
          green=$(gh run list --commit "$tip" --workflow CI --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "$green" -eq 0 ]; then
            echo "no green CI on tip yet; dispatching (GITHUB_TOKEN push events are suppressed)"
            gh workflow run CI --ref "${{ github.ref_name }}"
            run_id=
            for _ in $(seq 1 90); do
              run_id=$(gh run list --commit "$tip" --workflow CI --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ]; then break; fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "::error::CI never appeared for $tip"
              exit 1
            fi
            gh run watch "$run_id" --exit-status
          else
            echo "CI already green for tip"
          fi
          red=$(gh run list --commit "$tip" --json name,status,conclusion \
            --jq '.[] | select(.status != "completed" or .conclusion != "success") | "\(.name): \(.status)/\(.conclusion)"')
          if [ -n "$red" ]; then
            echo "::error::CI is not green for $tip"
            echo "$red"
            exit 1
          fi

      - name: create the tag
        uses: LiquidLogicLabs/git-action-tag-create-update@v2
        with:
          tag-name: v${{ steps.next.outputs.version }}
          tag-message: |
            l3io-age-passphrase v${{ steps.next.outputs.version }}

            ${{ inputs.bump }} release.
          update-existing: "false"
          force: "false"

      - name: hand the new tag to Publish
        uses: LiquidLogicLabs/git-action-trigger-workflow@v2
        with:
          workflow-name: Publish
          ref: v${{ steps.next.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: summary
        run: |
          {
            echo "### Tagged v${{ steps.next.outputs.version }}"
            echo
            echo "Publish is building multi-platform wheels for the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
